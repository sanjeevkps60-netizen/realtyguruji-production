<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Rounded background -->
  <rect width="240" height="240" rx="32" fill="#0a4a3c"/>

  <!-- Decorative leaves on left -->
  <g opacity="0.85">
    <path d="M28 100 Q40 75 35 50 Q25 60 25 85 Q23 100 28 100 Z" fill="#c9a84c"/>
    <path d="M38 110 Q48 95 50 80 Q40 88 36 100 Q33 110 38 110 Z" fill="#c9a84c" opacity="0.7"/>
    <path d="M25 130 Q35 122 38 115 Q28 118 22 128 Q22 132 25 130 Z" fill="#c9a84c" opacity="0.6"/>
  </g>

  <!-- Decorative leaves on right (mirrored) -->
  <g opacity="0.85">
    <path d="M212 100 Q200 75 205 50 Q215 60 215 85 Q217 100 212 100 Z" fill="#c9a84c"/>
    <path d="M202 110 Q192 95 190 80 Q200 88 204 100 Q207 110 202 110 Z" fill="#c9a84c" opacity="0.7"/>
    <path d="M215 130 Q205 122 202 115 Q212 118 218 128 Q218 132 215 130 Z" fill="#c9a84c" opacity="0.6"/>
  </g>

  <!-- Guru meditation figure -->
  <!-- Head -->
  <circle cx="120" cy="70" r="14" fill="#fff"/>
  <!-- Bun on top of head -->
  <ellipse cx="120" cy="56" rx="6" ry="5" fill="#fff"/>

  <!-- Body (torso in lotus pose) -->
  <path d="M100 88 Q120 82 140 88 Q145 105 142 125 Q140 135 138 140 L102 140 Q100 135 98 125 Q95 105 100 88 Z" fill="#fff"/>

  <!-- Left arm resting on knee -->
  <path d="M99 110 Q88 112 82 125 Q82 132 90 132 Q98 128 102 122 Z" fill="#fff"/>
  <!-- Hand mudra (left) -->
  <circle cx="86" cy="130" r="5" fill="#fff"/>

  <!-- Right arm resting on knee -->
  <path d="M141 110 Q152 112 158 125 Q158 132 150 132 Q142 128 138 122 Z" fill="#fff"/>
  <!-- Hand mudra (right) -->
  <circle cx="154" cy="130" r="5" fill="#fff"/>

  <!-- Lotus / crossed legs base -->
  <ellipse cx="120" cy="148" rx="44" ry="9" fill="#fff"/>
  <path d="M82 148 Q100 158 120 156 Q140 158 158 148 Q150 162 130 165 Q120 167 110 165 Q90 162 82 148 Z" fill="#fff" opacity="0.95"/>

  <!-- Brand text "Realty" -->
  <text x="120" y="195" text-anchor="middle" fill="#c9a84c" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" font-style="italic" letter-spacing="1">Realty</text>

  <!-- Brand text "Guruji" -->
  <text x="120" y="221" text-anchor="middle" fill="#c9a84c" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" font-style="italic" letter-spacing="2">Guruji</text>
</svg>
